[project]
name = "newworld-config-manager"
version = "1.1.0"
description = "PyQt6 desktop app for editing New World game config files"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "Involvex"}
]
keywords = ["new world", "config", "editor", "pyqt6", "rebindings", "usersettings"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "pillow>=11.3.0",
    "pyinstaller>=6.20.0",
    "pyqt6>=6.10.2",
]

[project.urls]
Homepage = "https://github.com/yourusername/NeWWorld-Config-Manager"
Documentation = "https://github.com/yourusername/NeWWorld-Config-Manager/wiki"
Repository = "https://github.com/yourusername/NeWWorld-Config-Manager"
Issues = "https://github.com/yourusername/NeWWorld-Config-Manager/issues"

[uv.dependency-groups.dev]
dev-dependencies = [
    "pyinstaller>=6.0.0",
    "pillow>=10.0.0",
]
